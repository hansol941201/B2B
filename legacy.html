<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="넷폼 B2B운영팀 업무·지표 트래커 — 고객여정 선행지표 판정, 팀·개인 업무 진행현황, 업무 화면 허브">
<title>B2B운영팀 업무보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>/* ============================================================
   B2B운영팀 업무 트래커
   넷폼 공통 디자인 시스템 (2026-07-30 확정 팔레트) 기반 · 라이트 단일 테마
   ============================================================ */
:root{
  --ink:#212A3E; --brand:#394867; --brand-2:#5B6E8F; --sub:#9BA4B5;
  --surf:#F1F6F9; --tint:#E4EDF5; --peach:#FFE8DB; --bg:#FFFFFF;
  --text-2:#768194; --text-3:#5F6A7C; --line:#D8DEE6; --line-2:#EAEEF3;
  --ok:#2F5D50;   --ok-bg:#E8F0EC;
  --warn:#8A5A3B; --warn-bg:#FFE8DB;
  --bad:#9A3B33;  --bad-bg:#F7E9E7;
  --na:#768194;   --na-bg:#F1F6F9;
  --r2:#B8C2D0; --r3:#8794AB; --r4:#5B6E8F; --r5:#394867;
  --sh:0 1px 2px rgba(33,42,62,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Pretendard','Noto Sans KR','Malgun Gothic','맑은 고딕',system-ui,sans-serif;
  font-size:14px;line-height:1.68;-webkit-font-smoothing:antialiased;word-break:keep-all;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;text-align:left}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--brand);outline-offset:-2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,'SFMono-Regular',Consolas,monospace;font-size:.92em}
.r{text-align:right}

/* ---------- 상단 네비 ---------- */
.topbar{background:var(--ink);color:#fff;position:sticky;top:0;z-index:60;
        box-shadow:0 2px 10px -6px rgba(33,42,62,.45)}
.tb-in{max-width:1320px;margin:0 auto;padding:0 22px;display:flex;align-items:stretch;gap:24px}
.tb-brand{display:flex;align-items:center;gap:10px;padding:12px 0;flex:0 0 auto}
.tb-brand .mk{width:34px;height:34px;border-radius:9px;font-size:12px;background:var(--peach);color:var(--ink);
              display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;flex:0 0 auto}
.tb-brand .tx{display:flex;flex-direction:column;line-height:1.25}
.tb-brand .nm{font-size:14.5px;font-weight:800;color:#fff;letter-spacing:-.01em}
.tb-brand .sb{font-size:10.5px;color:#96A3BC;font-weight:600}
.tabs{display:flex;gap:1px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{display:flex;align-items:center;gap:7px;padding:0 17px;font-size:14.5px;font-weight:700;
             color:#C3CDDE;border-bottom:4px solid transparent;white-space:nowrap;border-radius:0;letter-spacing:-.01em}
.tabs button .ic{font-size:11px;opacity:.75}
.tabs button:hover{color:#fff;background:rgba(255,255,255,.07)}
.tabs button[aria-current="page"]{color:var(--ink);font-weight:800;border-bottom-color:var(--peach);
                                  background:var(--peach)}
.tabs button[aria-current="page"] .ic{color:var(--ink);opacity:.7}

.tb-r{display:flex;align-items:center;gap:5px;font-size:11.5px;color:#96A3BC;flex:0 0 auto;white-space:nowrap}
.tb-r .num{color:#fff;font-weight:700}
.dot{width:6px;height:6px;border-radius:50%;background:#6FBF9B;display:inline-block}
.fb-badge{margin-left:11px;padding:2px 9px;border-radius:100px;font-size:10.5px;font-weight:700;
          background:rgba(255,255,255,.1);color:#C3CDDE;white-space:nowrap}
.fb-badge.fb-connecting{background:rgba(255,255,255,.12);color:#C3CDDE}
.fb-badge.fb-synced{background:rgba(111,191,155,.18);color:#8FE0BA}
.fb-badge.fb-saving{background:rgba(255,232,219,.18);color:#FFE8DB}
.fb-badge.fb-error{background:rgba(224,120,110,.2);color:#F3ACA3}
.fb-badge.fb-offline{background:rgba(224,120,110,.14);color:#E0A79E}
.main{padding:34px 30px 96px;background:var(--bg);min-height:calc(100vh - 58px)}
.wrap{max-width:1320px;margin:0 auto}

/* ---------- 페이지 헤더 ---------- */
.phead{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.phead h1{font-size:19px;font-weight:800;letter-spacing:-.02em}
.phead .hs{font-size:12.5px;color:var(--text-3);margin-top:5px;line-height:1.6}
.phead .meta{font-size:12px;color:var(--text-3);text-align:right;flex:0 0 auto}
.phead .meta b{color:var(--ink);font-weight:800}

/* ---------- 요약 스트립 ---------- */
.strip{display:flex;align-items:stretch;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:18px;background:var(--bg);flex-wrap:wrap}
.strip .s{padding:15px 18px;border-right:1px solid var(--line-2);min-width:92px;flex:0 0 auto}
.strip .s:last-child{border-right:0}
.strip .s .l{font-size:11px;color:var(--text-3);font-weight:600}
.strip .s .v{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.strip .s .v small{font-size:10.5px;font-weight:700;color:var(--text-2);margin-left:1px}
.strip .grow{flex:1;min-width:240px;border-right:0;background:var(--surf);display:flex;align-items:center;gap:11px;padding:15px 20px;border-left:3px solid var(--peach)}
.strip .grow .l{font-size:10.5px;font-weight:800;letter-spacing:.07em;color:var(--brand);flex:0 0 auto}
.strip .grow .txt{font-size:12.5px;color:var(--ink);line-height:1.5}
.strip .grow .txt b{color:var(--ink);font-weight:800}
.strip .grow .jump{margin-left:auto;flex:0 0 auto;font-size:11.5px;font-weight:800;color:var(--brand);border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 9px;white-space:nowrap}
.strip .grow .jump:hover{background:var(--tint)}

/* ---------- 필터 ---------- */
.filters{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.fg{display:flex;flex-wrap:wrap;gap:2px;background:var(--surf);border:1px solid var(--line);border-radius:7px;padding:2px;max-width:100%}
.fg button{font-size:12.5px;font-weight:700;color:var(--text-3);padding:5px 12px;border-radius:5px;white-space:nowrap}
.fg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:var(--sh)}
.fsearch{flex:1;min-width:150px;max-width:290px}
.fsearch input{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 11px;font-size:13px;background:var(--bg)}
.fsearch input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(57,72,103,.1)}
.fsel{width:auto;flex:0 0 auto;border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:12.5px;background:var(--bg);font-weight:700;color:var(--text-3)}
.fcount{font-size:12px;color:var(--text-3);margin-left:auto;white-space:nowrap}

/* ---------- 업무 표 ---------- */
.tt{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--bg)}
.tt-h,.tt-r{display:grid;grid-template-columns:minmax(0,1fr) 70px 208px 96px 42px 18px;gap:10px;align-items:center}
.tt-h{padding:11px 16px;background:var(--tint);font-size:11px;font-weight:800;color:var(--brand);letter-spacing:.02em}
.tt-r{width:100%;padding:13px 16px;border-top:1px solid var(--line-2);border-left:3px solid transparent;font-size:13.5px}
.tt-r:hover{background:var(--surf)}
.tt-r.k-done{border-left-color:var(--ok)}
.tt-r.k-prog{border-left-color:var(--brand)}
.tt-r.k-todo{border-left-color:var(--peach)}
.tt-r.on{background:var(--surf)}
.tt-n{font-weight:400;color:var(--ink);display:flex;align-items:center;gap:6px;min-width:0}
.tt-n span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt-w,.tt-p{font-size:12.5px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt-w{font-weight:700;color:var(--text-2)}
.tt-v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text-3)}
.tt-c{color:var(--sub);font-size:9px;text-align:center;transition:transform .15s}
.tt-r.on .tt-c{transform:rotate(90deg)}
.tt-d{padding:8px 16px 20px 58px;border-top:0;background:var(--surf);font-size:13px;color:var(--ink);line-height:1.8;display:none}
.tt-d.on{display:block}
.tt-d .lbl{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--brand);display:block;margin:8px 0 2px}
.tt-d .lbl:first-child{margin-top:2px}
.tt-empty{padding:34px 14px;text-align:center;color:var(--text-2);font-size:12px}
.flag{font-size:10.5px;font-weight:600;color:var(--text-2);flex:0 0 auto;line-height:1.5;white-space:nowrap}
.flag::before{content:"\00B7";margin-right:3px;color:var(--sub);font-weight:800}

/* 미니 막대 */
.mb{display:block;height:5px;border-radius:3px;background:var(--tint);overflow:hidden}
.mb i{display:block;height:100%;border-radius:3px;background:var(--brand)}
.mb.b-done i{background:var(--ok)}
.mb.b-todo i{background:var(--sub)}


/* ---------- 업무 KPI 행 ---------- */
.wkrow{border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-bottom:18px;overflow:hidden}
.wk-h{display:flex;align-items:baseline;gap:10px;padding:13px 18px 12px;background:var(--surf);
      border-bottom:1px solid var(--line);border-left:3px solid var(--peach)}
.wk-h .k{font-size:11.5px;font-weight:800;letter-spacing:.07em;color:var(--brand)}
.wk-h .d{font-size:11.5px;color:var(--text-3)}
.wkgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.wk{padding:17px 18px 18px;border-right:1px solid var(--line-2);min-width:0}
.wk:last-child{border-right:0}
.wk-l{font-size:11.5px;font-weight:700;color:var(--text-3);margin-bottom:7px;white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis}
.wk-v{display:flex;align-items:baseline;gap:6px;font-size:23px;font-weight:800;letter-spacing:-.03em;
      line-height:1.15;margin-bottom:11px;flex-wrap:wrap}
.wk-v small{font-size:12px;font-weight:700;color:var(--text-2);margin-left:-3px}
.wk-v .arw{font-size:12px;font-weight:800;color:var(--sub);margin:0 1px}
.wk-v .tgt{font-size:14px;font-weight:800;color:var(--text-3)}
.wk-v .chip{align-self:center;margin-left:auto}
.wk .meter{height:6px}
.wk-s{display:flex;justify-content:space-between;gap:6px;font-size:10.5px;color:var(--text-2);margin-top:8px;
      font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:1180px){ .wkgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .wk:nth-child(3n){border-right:0} .wk:nth-child(-n+3){border-bottom:1px solid var(--line-2)} }
@media (max-width:640px){ .wkgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wk{border-right:1px solid var(--line-2)} .wk:nth-child(2n){border-right:0}
  .wk:not(:nth-last-child(-n+2)){border-bottom:1px solid var(--line-2)} }

/* ---------- 목표 배너 ---------- */
.goal{display:flex;align-items:center;gap:22px;flex-wrap:wrap;border:1px solid var(--line);
      border-left:5px solid var(--peach);border-radius:10px;background:var(--surf);
      padding:24px 26px;margin-bottom:18px}
.goal .g-l{flex:1 1 340px;min-width:0}
.goal .k{display:block;font-size:11px;font-weight:800;letter-spacing:.09em;color:var(--brand);margin-bottom:9px}
.goal .g-t{font-size:16px;font-weight:800;letter-spacing:-.02em;line-height:1.5;color:var(--ink);text-wrap:balance}
.goal .g-edit{font-size:14px;font-weight:700}
.goal .g-r{display:flex;gap:8px;flex-wrap:wrap;flex:0 1 auto}
.gp{display:flex;align-items:baseline;gap:6px;background:var(--bg);border:1px solid var(--line);
    border-radius:9px;padding:13px 16px;white-space:nowrap}
.gp .l{font-size:11px;font-weight:700;color:var(--text-3);margin-right:2px}
.gp b{font-size:17px;font-weight:800;letter-spacing:-.02em}
.gp .a{font-size:11px;color:var(--sub);font-weight:800}
.gp .t{font-size:14px;font-weight:800;color:var(--text-3)}
.gp.c-ok b{color:var(--ok)} .gp.c-warn b{color:var(--warn)} .gp.c-bad b{color:var(--bad)} .gp.c-na b{color:var(--na)}
.gp.c-ok{border-color:#CFE0D7} .gp.c-warn{border-color:#F2D3C1} .gp.c-bad{border-color:#EBCFCC}

/* ---------- 루틴 업무 ---------- */
.rt-block{border-top:1px solid var(--line);background:var(--tint);padding-bottom:7px}
.rt-h{display:flex;align-items:center;gap:8px;padding:13px 17px 9px}
.rt-h .k{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--brand)}
.rt-h .c{font-size:11.5px;font-weight:800;color:var(--text-3);font-variant-numeric:tabular-nums}
.rt-h .mini{margin-left:auto}
.rt-row{display:grid;grid-template-columns:18px minmax(0,1fr) 34px;gap:9px;align-items:center;
        width:100%;padding:9px 17px;font-size:13px;color:var(--ink);line-height:1.45}
.rt-row:hover{background:#DCE7F1}
.rt-row .box{width:16px;height:16px;border:1.5px solid var(--sub);border-radius:4px;background:var(--bg);
             display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff}
.rt-row.done .box{background:var(--ok);border-color:var(--ok)}
.rt-row.done .t{color:var(--text-3);text-decoration:line-through;text-decoration-color:var(--sub)}
.rt-row .t{font-weight:500;min-width:0}
.rt-row .cy{font-size:10.5px;font-weight:800;color:var(--brand);background:var(--bg);border:1px solid var(--line);
            border-radius:100px;padding:0 6px;text-align:center;white-space:nowrap}
.rt-row.rt-edit{grid-template-columns:minmax(0,1fr) 62px 26px;padding:7px 17px}
.rt-row.rt-edit:hover{background:none}
.rt-cy{border:1px solid var(--line);border-radius:6px;padding:5px 4px;font-size:12px;background:var(--bg);width:100%}

/* ---------- 개인 성과 블록 ---------- */
.pf-h{display:flex;align-items:center;gap:8px;width:100%;padding:13px 17px;border-top:1px solid var(--line);
      font-size:11.5px;font-weight:800;color:var(--text-3);background:var(--bg)}
.pf-h:hover,.pf-h.on{background:var(--surf)}
.pf-h .chev{font-size:8px;color:var(--sub);transition:transform .15s}
.pf-h.on .chev{transform:rotate(90deg)}
.pf-h .c{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--sub)}
.pf-body{display:none;padding:4px 17px 16px;background:var(--surf)}
.pf-body.on{display:block}
.pf-row{display:grid;grid-template-columns:minmax(0,1fr) 62px 58px 62px;gap:7px;align-items:center;
        padding:10px 0;border-top:1px solid var(--line-2);font-size:12.5px}
.pf-row:first-child{border-top:0}
.pf-row .n{font-weight:700;color:var(--ink);min-width:0}
.pf-row .n .d{display:block;font-size:11px;font-weight:400;color:var(--text-3);line-height:1.4;margin-top:1px}
.pf-row .v{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.pf-row .v small{font-size:10px;color:var(--text-3);margin-left:1px}
.pf-row .tg{text-align:right;font-size:11px;color:var(--text-3);white-space:nowrap}
.pf-sep{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--brand);margin:10px 0 2px;
        border-top:1px solid var(--line);padding-top:8px}

/* ---------- 사람별 3열 보드 ---------- */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.bcol{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.bhead{display:block;width:100%;padding:17px 18px 18px;background:var(--surf);border-bottom:1px solid var(--line)}
.bhead:hover{background:#E6EEF4}
.bhead .top{display:flex;align-items:baseline;gap:8px}
.bhead .nm{font-size:17px;font-weight:800;letter-spacing:-.02em}
.bhead .rl{font-size:12px;font-weight:700;color:var(--text-3)}
.bhead .pct{margin-left:auto;font-size:22px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bhead .chev{font-size:9px;color:var(--sub);transition:transform .15s;flex:0 0 auto}
.bhead .chev.on{transform:rotate(90deg)}
.bhead .fc{display:block;font-size:12px;color:var(--text-3);margin:4px 0 8px;line-height:1.5}
.bhead .cnt{display:flex;gap:13px;margin-top:13px;font-size:12px;color:var(--text-3);flex-wrap:wrap}
.bhead .cnt b{color:var(--ink);font-weight:800}
.bgrp{display:grid;grid-template-columns:10px 26px minmax(0,1fr) auto auto;gap:7px;align-items:center;
      width:100%;padding:15px 17px;border-top:1px solid var(--line);background:var(--bg)}
.bgrp:hover{background:var(--surf)}
.bgrp.on{background:var(--surf)}
.bgrp .chev{font-size:8px;color:var(--sub);transition:transform .15s}
.bgrp.on .chev{transform:rotate(90deg)}
.bgrp .pg{font-size:10px;font-weight:800;color:var(--brand);background:var(--tint);border-radius:4px;padding:1px 4px;text-align:center}
.bgrp .t{font-size:13.5px;font-weight:800;min-width:0;letter-spacing:-.015em;color:var(--ink)}
.bgrp .c{font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}
.bgrp .v{font-size:12.5px;font-weight:800;color:var(--text-3);font-variant-numeric:tabular-nums}
.bgrp-b{display:none;border-top:1px solid var(--line-2)}
.bgrp-b.on{display:block}
.btk{display:grid;grid-template-columns:minmax(0,1fr) 44px 28px;gap:9px;align-items:center;width:100%;
     padding:11px 17px 11px 24px;border-left:3px solid transparent;font-size:13px;line-height:1.5}
.btk:hover,.btk.on{background:var(--surf)}
.btk.k-done{border-left-color:var(--ok)}
.btk.k-prog{border-left-color:var(--brand)}
.btk.k-todo{border-left-color:var(--peach)}
.btk .n{color:var(--ink);font-weight:400;min-width:0;letter-spacing:0}
.btk .n .flag{margin-left:5px}
.btk .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text-3);font-size:12px}
.btk-d{display:none;padding:11px 17px 19px 24px;background:var(--surf);font-size:12.5px;color:var(--ink);line-height:1.8}
.btk-d.on{display:block}
.btk-d .lbl{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--brand);display:block;margin:13px 0 2px}
.btk-d .lbl:first-child{margin-top:0}
.bempty{padding:20px 15px;color:var(--text-3);font-size:12.5px;text-align:center}
.bprojs{border-top:0}
.pj-add{padding:14px 17px;border-top:1px solid var(--line)}
.pj-tools{display:flex;gap:7px;padding:13px 17px 6px;flex-wrap:wrap}
.vtoggle{margin-left:auto}

/* ---------- PDF 버튼 ---------- */
.prwrap{position:relative;display:inline-block;margin-left:10px;vertical-align:middle}
.prbtn{font-size:12px;font-weight:800;color:var(--brand);border:1px solid var(--line);border-radius:7px;
       padding:5px 11px;background:var(--bg);white-space:nowrap}
.prbtn:hover{background:var(--surf)}
.prmenu{display:none;position:absolute;right:0;top:calc(100% + 5px);z-index:40;background:var(--bg);
        border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 22px -10px rgba(33,42,62,.28);
        min-width:150px;padding:4px;text-align:left}
.prmenu.on{display:block}
.prmenu button{display:block;width:100%;padding:7px 11px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--ink)}
.prmenu button:hover{background:var(--surf)}
.prmenu button.off{color:var(--bad);border-top:1px solid var(--line);border-radius:0 0 6px 6px;margin-top:3px;padding-top:8px}

/* ---------- 편집 ---------- */
.editbtn{font-size:12.5px;font-weight:800;color:var(--brand);border:1px solid var(--line);
         border-radius:7px;padding:6px 13px;background:var(--bg);white-space:nowrap}
.editbtn:hover{background:var(--surf)}
.editbtn.on{background:var(--peach);color:var(--ink);border-color:#E8C4AC;font-weight:800}
.mini{font-size:11.5px;font-weight:700;color:var(--brand);border:1px solid var(--line);border-radius:6px;
      padding:4px 9px;background:var(--bg);white-space:nowrap}
.mini:hover{background:var(--tint)}
.mini.add{color:var(--brand);border-style:dashed}
.mini.danger{color:var(--bad);border-color:#EBCFCC}
.mini.danger:hover{background:var(--bad-bg)}
.ef{padding:15px 17px 18px;background:var(--surf);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ef-l{display:block;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--brand);margin:14px 0 4px}
.btk-d .ef-l:first-child,.ef .ef-l:first-child{margin-top:0}
.ef-i{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:13px;
      background:var(--bg);font-family:inherit;line-height:1.55}
.ef-i:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(57,72,103,.1)}
.ef-p{display:flex;align-items:center;gap:9px}
.ef-p input[type=range]{flex:1 1 auto;min-width:60px;width:auto;accent-color:var(--brand);height:20px}
input[type=number].ef-n{width:70px;flex:0 0 auto;border:1px solid var(--line);border-radius:6px;padding:6px 7px;font-size:13px;
      background:var(--bg);text-align:right;font-variant-numeric:tabular-nums}
.ef-p span{font-size:12px;color:var(--text-3);font-weight:700}
.ef-btns{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}

@media (max-width:1180px){ .board{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:820px){ .board{grid-template-columns:1fr} .vtoggle{margin-left:0} }

/* ---------- 범례 ---------- */
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:11.5px;color:var(--text-3);margin-top:18px;padding-left:2px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}

/* ---------- 카드 ---------- */
.card{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:22px}
.card + .card,.tt + .card,.card + .tt{margin-top:16px}
.card-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:15px}
.card-h h2{font-size:15px;font-weight:800}
.card-h .badge{font-size:10.5px;font-weight:700;background:var(--tint);color:var(--brand);padding:2px 8px;border-radius:100px}
.card-h .rt{margin-left:auto;font-size:10.5px;font-weight:800;color:var(--brand);border:1px solid var(--line);border-radius:6px;padding:4px 9px;background:var(--bg)}
.card-h .rt:hover{background:var(--surf);text-decoration:none}
.card-h .rt[aria-disabled="true"]{color:var(--sub);cursor:not-allowed}

/* ---------- 지표 표 ---------- */
.kt{border:1px solid var(--line);border-radius:9px;overflow:hidden}
.kt-h,.kt-r{display:grid;grid-template-columns:22px minmax(0,1fr) 92px 96px 82px 68px 18px;gap:10px;align-items:center}
.kt-h{padding:11px 16px;background:var(--tint);font-size:11px;font-weight:800;color:var(--brand)}
.kt-r{width:100%;padding:15px 16px;border-top:1px solid var(--line-2);font-size:13.5px}
.kt-r:hover,.kt-r.on{background:var(--surf)}
.kt-r .st{font-size:10.5px;font-weight:800;color:var(--sub);text-align:center}
.kt-r .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kt-r .cur{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;font-size:16px}
.kt-r .cur small{font-size:10px;color:var(--text-2);margin-left:1px;font-weight:700}
.kt-r .tg{text-align:right;font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.kt-r .x{display:block;min-width:0}
.kt-r.pinch{background:var(--surf)}
.kt-d{padding:8px 16px 20px 48px;background:var(--surf);font-size:13px;color:var(--ink);line-height:1.8;display:none}
.kt-d.on{display:block}
.kt-d .lbl{font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--brand);display:block;margin:13px 0 2px}
.kt-d .lbl:first-child{margin-top:2px}

/* 상태 배지 */
.chip{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:100px;white-space:nowrap;border:1px solid transparent}
.chip .g{font-size:8px;line-height:1}
.c-ok{background:var(--ok-bg);color:var(--ok);border-color:#CFE0D7}
.c-warn{background:var(--warn-bg);color:var(--warn);border-color:#F2D3C1}
.c-bad{background:var(--bad-bg);color:var(--bad);border-color:#EBCFCC}
.c-na{background:var(--na-bg);color:var(--na);border-color:var(--line)}
.meter{display:block;height:5px;border-radius:3px;background:var(--tint);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:var(--brand)}
.meter.m-ok i{background:var(--ok)} .meter.m-warn i{background:var(--warn)} .meter.m-bad i{background:var(--bad)}
.meter.m-na{background:repeating-linear-gradient(135deg,var(--surf),var(--surf) 3px,var(--tint) 3px,var(--tint) 6px)}

/* ---------- 타일 ---------- */
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.tile{border:1px solid var(--line);border-radius:9px;padding:15px 15px}
.tile .l{font-size:11px;color:var(--text-3);font-weight:600;margin-bottom:3px;line-height:1.4}
.tile .v{font-size:20px;font-weight:800;letter-spacing:-.025em;line-height:1.2}
.tile .v small{font-size:11px;font-weight:700;margin-left:1px}
.tile .s{font-size:11px;color:var(--text-3);margin-top:3px;line-height:1.45}
.tile.hero{background:var(--surf)}

/* ---------- 퍼널 ---------- */
.funnel{display:flex;flex-direction:column;gap:6px}
.fstep{display:grid;grid-template-columns:84px 1fr 116px;gap:11px;align-items:center;font-size:12.5px}
.fbar{height:22px;border-radius:4px;background:var(--tint);position:relative;overflow:hidden}
.fbar i{display:block;height:100%;border-radius:4px}
.fbar span{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:10.5px;font-weight:800;color:#fff}
.fbar span.dk{color:var(--ink)}
.fconv{font-size:12px;color:var(--text-3);text-align:right}
.fconv b{font-weight:800;color:var(--ink)}

/* ---------- 멤버 카드 ---------- */
.mcards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.mcard{border:1px solid var(--line);border-radius:9px;padding:13px 15px;background:var(--bg);width:100%}
.mcard[aria-pressed="true"]{border-color:var(--brand);background:var(--surf);box-shadow:inset 0 0 0 1px var(--brand)}
.mcard .n{font-size:16px;font-weight:800;letter-spacing:-.01em}
.mcard .n span{font-size:11.5px;font-weight:700;color:var(--text-3);margin-left:5px}
.mcard .f{font-size:12px;color:var(--text-3);margin-top:4px;line-height:1.55;min-height:34px}
.mcard .st{display:flex;align-items:baseline;gap:8px;margin-top:9px;font-size:11.5px;color:var(--text-3)}
.mcard .st b{font-size:20px;font-weight:800;color:var(--ink);letter-spacing:-.02em}

/* ---------- 마인드맵 ---------- */
.mmwrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px;padding:6px 0}
.mm{position:relative;min-width:1160px}
.mm svg{position:absolute;top:0;left:0;overflow:visible}
.mm .n{position:absolute;display:flex;flex-direction:column;justify-content:center;border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:11px;line-height:1.35;background:var(--bg)}
.mm .n .t{font-weight:700;letter-spacing:-.01em}
.mm .n[class$="k-done"] .t,.mm .n[class$="k-prog"] .t,.mm .n[class$="k-todo"] .t{font-weight:400}
.mm .n .g{font-size:10px;color:var(--text-2);margin-top:1px}
.mm .n-root{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:800;align-items:center;justify-content:center}
.mm .n-prog{background:var(--brand);border-color:var(--brand);color:#fff}
.mm .n-prog .g{color:#C7D2E2}
.mm .n-own{background:var(--tint);border-color:var(--sub)}
.mm .n-rt{background:var(--peach);border-color:#E8C4AC}
.mm .n .t .tail{float:right;font-size:10px;font-weight:800;color:var(--text-3);margin-left:8px;font-variant-numeric:tabular-nums}
.mm .n-prog .t .tail{color:#C7D2E2}
.mm .k-done{border-left:3px solid var(--ok)}
.mm .k-prog{border-left:3px solid var(--brand)}
.mm .k-todo{border-left:3px solid var(--peach)}
.mm .bar{height:3px;border-radius:2px;background:var(--tint);margin-top:4px;overflow:hidden}
.mm .bar i{display:block;height:100%;background:var(--brand)}
.mm .n-prog .bar{background:rgba(255,255,255,.25)} .mm .n-prog .bar i{background:#fff}

/* ---------- 프로그램 (P1~P5) ---------- */
.pgcard{border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden}
.pgcard + .pgcard{margin-top:16px}
.pgcard.hot{border-color:var(--brand);box-shadow:inset 3px 0 0 var(--peach)}
.pg-h{display:grid;grid-template-columns:44px minmax(0,1fr) 150px 62px;gap:12px;align-items:center;
      padding:18px 20px;background:var(--surf);border-bottom:1px solid var(--line)}
.pg-h .id{display:block;font-size:15px;font-weight:800;color:#fff;background:var(--brand);border-radius:7px;
          text-align:center;padding:5px 0;letter-spacing:-.01em}
.pg-h .t{display:block;font-size:15px;font-weight:800;letter-spacing:-.02em}
.pg-h .g{display:block;font-size:12px;color:var(--text-3);margin-top:3px;line-height:1.5}
.pg-h .p{display:block;font-size:20px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.pg-b{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:0}
.pg-col{padding:18px 20px 20px}
.pg-col + .pg-col{border-left:1px solid var(--line-2)}
.pg-lab{font-size:10.5px;font-weight:800;letter-spacing:.07em;color:var(--brand);margin-bottom:12px}
.pg-k{display:grid;grid-template-columns:20px minmax(0,1fr) 76px 84px;gap:9px;align-items:center;
      padding:12px 0;border-top:1px solid var(--line-2);font-size:13px}
.pg-k:first-of-type{border-top:0}
.pg-k .st{font-size:11px;font-weight:800;color:var(--sub);text-align:center}
.pg-k .n{font-weight:700;min-width:0}
.pg-k .n span{display:block;font-size:11px;font-weight:400;color:var(--text-3);line-height:1.4;margin-top:1px}
.pg-k .v{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.pg-k .v small{font-size:10.5px;color:var(--text-3);font-weight:700}
.pg-none{font-size:12.5px;color:var(--text-3);padding:6px 0;line-height:1.6}
.pg-m{padding:13px 0;border-top:1px solid var(--line-2)}
.pg-m:first-of-type{border-top:0}
.pg-m .top{display:flex;align-items:baseline;gap:8px;font-size:13px}
.pg-m .top .nm{font-weight:800}
.pg-m .top .rl{font-size:11px;color:var(--text-3);font-weight:600}
.pg-m .top .ct{margin-left:auto;font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.pg-m .top .pc{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
.pg-m .mb{margin:9px 0 8px}
.pg-m .list{display:flex;flex-wrap:wrap;gap:5px}
.pg-m .list span{font-size:11px;color:var(--text-3);background:var(--surf);border:1px solid var(--line-2);
                 border-radius:5px;padding:2px 7px;white-space:nowrap}
.pg-m .list span b{color:var(--ink);font-weight:700;margin-left:4px;font-variant-numeric:tabular-nums}

/* ---------- 자동화 ---------- */
.au-h,.au-r{display:grid;grid-template-columns:66px minmax(0,1.5fr) minmax(0,1.2fr) 96px 60px 44px 16px;
            gap:11px;align-items:center}
.au{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.au-h{padding:11px 16px;background:var(--tint);font-size:11px;font-weight:800;color:var(--brand)}
.au-r{width:100%;padding:15px 16px;border-top:1px solid var(--line-2);font-size:13px;text-align:left}
.au-r:hover,.au-r.on{background:var(--surf)}
.au-r .n{font-weight:700;color:var(--ink);min-width:0;line-height:1.45}
.au-r .n span{display:block;font-size:11.5px;font-weight:400;color:var(--text-3);margin-top:2px;line-height:1.45}
.au-r .w{font-size:12px;color:var(--text-3);line-height:1.5;min-width:0}
.au-r .c{font-size:11.5px;color:var(--text-3);text-align:center;white-space:nowrap}
.au-r .sc{min-width:0}
.au-r .sc .t{display:block;font-size:10px;color:var(--text-2);margin-top:4px;text-align:center;white-space:nowrap}
.au-sec{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--brand);margin:22px 0 3px;
        border-top:1px solid var(--line);padding-top:14px}
.ef-l .miss{font-size:9.5px;font-weight:700;color:var(--warn);background:var(--peach);
            border-radius:4px;padding:0 5px;margin-left:5px;letter-spacing:0}
.au-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line-2);
         border:1px solid var(--line-2);border-radius:7px;overflow:hidden;margin-bottom:15px}
.au-f{background:var(--bg);padding:12px 14px;font-size:12.5px;line-height:1.65}
.au-f .l{display:block;font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--brand);margin-bottom:2px}
.au-f.empty{background:var(--surf)}
.au-f.empty span:last-child{color:var(--sub);font-style:normal}
.au-links{display:flex;flex-wrap:wrap;gap:6px}
.au-lk{font-size:11.5px;font-weight:700;color:var(--brand);background:var(--bg);border:1px solid var(--line);
       border-radius:6px;padding:4px 10px}
.au-lk:hover{background:var(--tint);text-decoration:none}
.au-lk.empty{color:var(--sub);font-weight:600;border-style:dashed;background:transparent}
.lk-e{gap:0}
.kchk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px;margin-top:2px}
.kchk label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3);cursor:pointer}
.kchk input{width:auto;accent-color:var(--brand)}
.au-d{display:none;padding:12px 16px 20px;background:var(--surf);font-size:12.5px;line-height:1.8}
.au-d.on{display:block}
.au-d .lbl{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--brand);display:block;margin:9px 0 1px}
.au-d .lbl:first-child{margin-top:0}
.s-run{background:var(--ok-bg);color:var(--ok);border-color:#CFE0D7}
.s-dev{background:var(--warn-bg);color:var(--warn);border-color:#F2D3C1}
.s-plan{background:var(--na-bg);color:var(--na);border-color:var(--line)}
.s-off{background:var(--bad-bg);color:var(--bad);border-color:#EBCFCC}
.austrip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin-bottom:18px}
.austrip .b{border:1px solid var(--line);border-radius:9px;padding:16px 18px}
.austrip .b .l{font-size:11px;color:var(--text-3);font-weight:600}
.austrip .b .v{font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.2;margin-top:2px}
.austrip .b .s{font-size:11px;color:var(--text-2);margin-top:3px}
.austrip .b.hi{background:var(--surf);border-left:3px solid var(--peach)}
@media (max-width:1080px){
  .pg-b{grid-template-columns:1fr}
  .pg-col + .pg-col{border-left:0;border-top:1px solid var(--line-2)}
  .austrip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .au-h,.au-r{grid-template-columns:64px minmax(0,1fr) 88px 44px 16px}
  .au-h .c-was,.au-r .w,.au-h .c-own,.au-r .own{display:none}
  .au-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .pg-h{grid-template-columns:40px minmax(0,1fr) 52px}
  .pg-h .mtr{display:none}
  .au-h,.au-r{grid-template-columns:60px minmax(0,1fr) 80px 14px}
  .au-grid{grid-template-columns:1fr}
  .kchk{grid-template-columns:1fr}
}

/* ---------- 링크 허브 ---------- */
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.lk{border:1px solid var(--line);border-radius:9px;padding:16px 16px;display:flex;flex-direction:column;gap:7px}
.lk .t{font-size:13.5px;font-weight:800}
.lk .d{font-size:12px;color:var(--text-3);line-height:1.6;flex:1}
.lk .f{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
.lk .who{font-size:11px;color:var(--text-2);font-weight:600}
.lk .go{font-size:11.5px;font-weight:800;color:var(--brand);border:1px solid var(--line);border-radius:6px;padding:3px 9px}
.lk .go:hover{background:var(--surf);text-decoration:none}
.lk .go[aria-disabled="true"]{color:var(--sub);cursor:not-allowed}

/* ---------- 표 / 폼 ---------- */
.card-sub{font-size:12.5px;color:var(--text-3);margin:-7px 0 18px;max-width:74ch;line-height:1.65}
.frow{display:grid;grid-template-columns:170px minmax(0,1fr);gap:14px;align-items:center;
      padding:14px 0;border-top:1px solid var(--line-2)}
.frow:first-of-type{border-top:0;padding-top:0}
.frow label{font-size:12.5px;font-weight:700;color:var(--text-3)}
.frow textarea{resize:vertical;font-family:inherit;line-height:1.6}

.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:13px 14px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--line-2)}
th{background:var(--tint);color:var(--brand);font-weight:800;font-size:11px;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surf)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.tsub{font-size:11.5px;color:var(--text-3);margin-top:2px}
input[type=text],input[type=url],input[type=number],select,textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:13px;background:var(--bg)}
input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(57,72,103,.1)}
input.dirty,select.dirty{background:var(--peach);border-color:var(--brand)}
.btn{display:inline-flex;align-items:center;gap:5px;background:var(--brand);color:#fff;border-radius:7px;padding:8px 14px;font-size:13px;font-weight:700}
.btn:hover{background:var(--ink)}
.btn:disabled,.btn:disabled:hover{opacity:.45;cursor:not-allowed;background:var(--bg)}
.btn.ghost{background:var(--bg);color:var(--brand);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--surf)}
.btn.warnb{background:var(--bg);color:var(--bad);border:1px solid #EBCFCC}
.btn.warnb:hover{background:var(--bad-bg)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.note{background:var(--surf);border-left:3px solid var(--sub);border-radius:0 6px 6px 0;padding:14px 16px;font-size:12.5px;color:var(--text-3);line-height:1.75;margin-top:16px}
.note b{color:var(--ink)}
.disc{margin-top:18px}
.disc summary{font-size:12.5px;font-weight:800;color:var(--brand);cursor:pointer;padding:7px 11px;background:var(--surf);border:1px solid var(--line);border-radius:7px;list-style:none}
.disc summary::-webkit-details-marker{display:none}
.disc summary::before{content:"▸ ";font-size:9px}
.disc[open] summary::before{content:"▾ "}
.disc[open] summary{border-radius:7px 7px 0 0}
.disc .body{border:1px solid var(--line);border-top:0;border-radius:0 0 7px 7px;padding:20px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:9px 16px;border-radius:100px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:90}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- 개인 색 ---------- */
.mchip{display:inline-block;font-size:11.5px;font-weight:800;padding:1px 8px;border-radius:100px;
       border:1px solid transparent;white-space:nowrap}
.dotm{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:0}
.bcol{border-top:4px solid var(--pc,var(--brand))}
.bcol.mine{box-shadow:0 0 0 2px var(--pcb,var(--brand))}
.bwho{display:flex;align-items:center;gap:10px;padding:16px 18px 14px;background:var(--pct,var(--surf));
      border-bottom:1px solid var(--line)}
.bwho .av{width:28px;height:28px;border-radius:50%;color:#fff;font-weight:800;font-size:13px;
          display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.bwho .who-n{font-size:17px;font-weight:800;letter-spacing:-.02em;color:var(--pc,var(--ink))}
.bwho .who-r{font-size:12px;font-weight:700;color:var(--text-3)}
.bwho .myedit{margin-left:auto;border-color:var(--pcb,var(--line));color:var(--pc,var(--brand))}
.bwho .myedit.on{background:var(--pc,var(--brand));color:#fff;border-color:var(--pc,var(--brand))}
.bhead{background:var(--bg)!important}
.bhead:hover{background:var(--surf)!important}
.bhead .top{display:flex;align-items:center;gap:10px}
.bhead .fc{flex:1;min-width:0;font-size:12px;color:var(--text-3);line-height:1.5;margin:0}
.bcol .mb i{background:var(--pc,var(--brand))}
.bcol .btk.k-prog{border-left-color:var(--pc,var(--brand))}
.bgrp .pg{background:var(--pct,var(--tint));color:var(--pc,var(--brand))}
.pg-m .top .nm{color:var(--pc,var(--ink))}
.pg-m .mb i{background:var(--pc,var(--brand))}

/* ---------- 반응형 ---------- */
@media (max-width:1080px){
  .tiles{grid-template-columns:repeat(3,1fr)}
  .tt-h,.tt-r{grid-template-columns:1fr 64px 96px 42px 18px}
  .tt-h .c-proj,.tt-r .tt-p{display:none}
}
@media (max-width:860px){
  .tb-in{padding:0 12px;gap:12px}
  .tb-brand .tx{display:none}
  .tb-r{display:none}
  .tabs button{padding:0 11px;font-size:12.5px}
  .main{padding:16px 14px 48px}
  .mcards{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .tt-h,.tt-r{grid-template-columns:minmax(0,1fr) 64px 34px 14px;gap:8px;padding:9px 11px}
  .tt-h .c-bar,.tt-r .tt-b,.tt-r .flag{display:none}
  .tt-n span.t{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .strip .s{flex:1 1 30%;min-width:0;padding:8px 12px}
  .strip .grow{flex:1 1 100%;flex-wrap:wrap;gap:6px}
  .strip .grow .jump{margin-left:0}
  .tt-d{padding-left:20px}
  .kt-h,.kt-r{grid-template-columns:1fr 76px 60px 16px}
  .kt-h .c-x,.kt-r .x{display:none}
  .kt-d{padding-left:16px}
  .fstep{grid-template-columns:66px 1fr}
  .fconv{grid-column:2;text-align:left}
  .fcount{margin-left:0}
}

  .pr-sub{font-size:8pt;font-weight:400;color:#5F6A7C;margin-left:7pt}

           margin-bottom:8pt;break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pr-goal .k{display:block;font-size:7.4pt;font-weight:800;letter-spacing:.08em;color:#394867;margin-bottom:2pt}
  .pr-goal .t{font-size:11pt;font-weight:800;color:#212A3E;line-height:1.45}
  .pr-note{background:#F1F6F9;border-left:2pt solid #394867;padding:5pt 7pt;font-size:8.2pt;
           color:#2b3444;margin:6pt 0;line-height:1.55;break-inside:avoid}
  .pr-note b{color:#212A3E}
  table.pr-sum{width:100%;border-collapse:collapse;margin-bottom:7pt;break-inside:avoid}
  table.pr-sum td{border:.6pt solid #D8DEE6;padding:5pt 7pt;text-align:left;width:16.6%}
  table.pr-sum td span{display:block;font-size:7.4pt;color:#5F6A7C}

  table.pr-t2{width:100%;border-collapse:collapse;margin-bottom:4pt}
  table.pr-t2 th{background:#E4EDF5;color:#212A3E;font-size:7.6pt;font-weight:800;text-align:left;
                 padding:3.5pt 6pt;border:.6pt solid #C8D2DE}
  table.pr-t2 td{border:.6pt solid #D8DEE6;padding:3.5pt 6pt;vertical-align:top;font-size:8.2pt}
  table.pr-t2 td.c{text-align:center}
  table.pr-t2 tr{break-inside:avoid}
  .pr-map .pr-mmbox{break-inside:avoid;margin-bottom:8pt;border:.6pt solid #D8DEE6;border-radius:3pt;
                    padding:4pt 2pt;overflow:hidden}
  .pr-map .mm{position:relative}
  .pr-map .mm .n{font-size:7.4pt;padding:2.5pt 5pt;border-radius:3pt;line-height:1.3}
  .pr-map .mm .n .g{font-size:6.6pt;margin-top:0}
  .pr-map .mm .n .t .tail{font-size:6.8pt}
  .pr-map .mm .bar{height:2pt;margin-top:2pt}
  #printroot .n-root{background:#212A3E!important;color:#fff!important;border-color:#212A3E!important;
                     -webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printroot .n-prog{background:#394867!important;color:#fff!important;border-color:#394867!important;
                     -webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printroot .n-prog .g{color:#C7D2E2!important}
  #printroot .n-own{background:#E4EDF5!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printroot .n-rt{background:#FFE8DB!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printroot table.pr-sum td,#printroot table.pr-t2 th,#printroot .pr-note{
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

  /* ============================================================

  var PC = window.PerfCalc || PerfCalc;
  var KEY_TASKTAB = "netform.b2b.tracker.tasktab.v2";
  var KEY_SELMEMBER = "netform.b2b.tracker.member.v1";

  try { taskTab = localStorage.getItem(KEY_TASKTAB) || "simple"; } catch (e) {}
  var pfSel = "";
  try { pfSel = localStorage.getItem(KEY_SELMEMBER) || ""; } catch (e) {}
  var pfNavMore = false;

  var pfBoardOpen = {}; // 담당자 카드의 개인 지표 접기

  try { pfCardOpen = JSON.parse(localStorage.getItem(KEY_CARDOPEN) || "{}") || {}; } catch (e) {}
  var pfMonth = pfThisMonth();
  var PF_ST = { todo: "미착수", prog: "진행 중", done: "완료" }, PF_ICON = { todo: "○", prog: "▶", done: "✓" };
  var pfM = null; // 열린 상세 창 { type, id, month, view, baseRev, dirty }

  function pfThisMonth() {
    var d = new Date(), m = d.getMonth() + 1;
    return d.getFullYear() + "-" + (m < 10 ? "0" : "") + m;
  }
  /* 입력자를 따로 적지 않으면 지금 고른 팀원 이름으로 남긴다 */
  function pfActor() {

    return s && s !== "all" ? String(member(s).name).trim() : "";
  }
  function pfSelected() {
    if (pfSel === "all") return "all";

    var withWork = D.members.filter(function (m) {
      return projectsOf(m.id).length || (D.routines[m.id] || []).length || (D.leadDefs || []).some(function (l) { return l.member === m.id; });
    })[0];
    return withWork ? withWork.id : (D.members[0] ? D.members[0].id : "all");
  }
  function pfFind(col, id) {

    return null;
  }
  function pfDef(type, id) { return pfFind(type === "kpi" ? "mainKpis" : type === "lead" ? "leadDefs" : "lagDefs", id); }
  function pfRec(ref, month) { return pfFind("perfMonthly", ref + "_" + month); }
  function pfRate(ref, month) { return PC.rate(pfRec(ref, month)); }
  function pfLisOf(mid) {
    var o = {};
    (D.leadDefs || []).forEach(function (l) { if (l.member === mid) o[l.id] = 1; });
    return function (li) { return !!o[li]; };
  }
  function pfMembersAll() { // 개인 지표가 등록된 팀원
    var seen = {}, out = [];
    (D.leadDefs || []).concat(D.lagDefs || []).forEach(function (x) { if (x.member && !seen[x.member]) { seen[x.member] = 1; out.push(x.member); } });
    return out;
  }
  function pfMembersOf(k) { // 이 KPI에 연결된 지표가 있는 팀원
    var seen = {}, out = [];
    (k.links || []).forEach(function (l) {
      var d = pfFind("leadDefs", l.li), mid = d && d.member;
      if (mid && !seen[mid]) { seen[mid] = 1; out.push(mid); }

  }
  function pfMemberScore(k, mid, month, draft) { return PC.score(k, month, pfRec, draft, pfLisOf(mid)); }
  function pfTeamScore(k, month, draft) {
    return PC.teamScore(k, pfMembersOf(k), function (mid) { return pfMemberScore(k, mid, month); }, draft);
  }
  /* 지표가 먼저 저장된 이전 구조를 현재 구조에 맞춘다. 기존 값은 지우지 않는다 */
  function pfNormalize(d) {
    (d.leadDefs || []).forEach(function (l) { if (!l.member) l.member = "shs"; });

      if (!g.member) g.member = "shs";

  function pfKeep(next, prev, prevWins) {
    PF_COLS.forEach(function (col) {
      var map = {};
      if (!prevWins) (prev[col] || []).forEach(function (x) { map[x.id] = x; });
      (next[col] || []).forEach(function (x) { map[x.id] = x; });
      if (prevWins) (prev[col] || []).forEach(function (x) { map[x.id] = x; });
      next[col] = Object.keys(map).sort().map(function (id) { return map[id]; });
    });
    if (prevWins || !next.perfConfig) next.perfConfig = prev.perfConfig || next.perfConfig;
    return next;
  }

  function pagePrograms() {

          '<span class="n">' + esc(k.name) + "<span>" + esc(k.plain) + "</span></span>" +

      var byOwn = {};

          '<span class="ct">프로젝트 ' + mine.length + " · 업무 " + n + (todo ? " · 미착수 " + todo : "") + '</span><span class="pc">' + mp + "%</span></div>" +
          mb(mp) + '<div class="list">' + mine.map(function (p) {

      return '<div class="pgcard' + (hot ? " hot" : "") + '"><div class="pg-h">' +
        '<span class="id">' + esc(g.id) + "</span>" +

    { k: "url",  l: "실행 · 결과 화면 주소", ph: "https://…" },

  function auScore(a) {
    var n = 0; AUF.forEach(function (f) { if ((a[f.k] || "").trim()) n++; });
    return n;
  }
  var auOpen = {}, auFlt = "all";

  function pageAuto() {
    var list = D.automations || [];
    var cnt = { run: 0, dev: 0, plan: 0, off: 0 };
    list.forEach(function (a) { cnt[a.st] = (cnt[a.st] || 0) + 1; });
    var full = list.filter(function (a) { return auScore(a) === AUF.length; }).length;
    var noLink = list.filter(function (a) { return !(a.url || "").trim() && !(a.code || "").trim(); }).length;

    var strip = '<div class="austrip">' +
      [["운영중", cnt.run + "건", "지금 돌고 있는 것", true],
       ["개발중", cnt.dev + "건", "만드는 중", false],
       ["실체화 완료", full + " / " + list.length, "인수인계 6개 항목이 다 채워진 것", false],
       ["주소 미등록", noLink + "건", "실행·코드 위치를 모르는 것", false]].map(function (x) {
        return '<div class="b' + (x[3] ? " hi" : "") + '"><div class="l">' + esc(x[0]) +
          '</div><div class="v num">' + esc(x[1]) + '</div><div class="s">' + esc(x[2]) + "</div></div>";
      }).join("") + "</div>";

    var fbtn = [{ id: "all", n: "전체" }]
      .concat(["run", "dev", "plan", "off"].map(function (k) { return { id: k, n: ST[k] }; }))
      .concat([{ id: "gap", n: "실체화 미완" }, { id: "nolink", n: "주소 없음" }])
      .concat(D.members.map(function (m) { return { id: "m:" + m.id, n: m.name }; }))
      .map(function (o) { return '<button data-au="' + esc(o.id) + '" aria-pressed="' + (auFlt === o.id) + '">' + esc(o.n) + "</button>"; }).join("");

    var rows = list.filter(function (a) {
      if (auFlt === "all") return true;

  var mmFilter = "all", mmMode = "own";

  function buildTree() {
    var root = { t: "B2B운영팀", g: null, cls: "n-root", c: [] };
    if (mmMode === "prog") {
      D.programs.forEach(function (pg) {
        var ps = D.projects.filter(function (p) { return p.prog === pg.id && (mmFilter === "all" || p.owner === mmFilter); });
        if (!ps.length) return;
        var pn = { t: pg.id + " " + pg.name, g: "리드 · " + member(pg.owner).name, cls: "n-prog", pct: pctOfSet(ps), c: [] };
        ps.forEach(function (p) {
          var jn = { t: p.name, g: member(p.owner).name, cls: "n-own", pct: pctOfProject(p), c: [] };
          (p.tasks || []).forEach(function (t) {
            var v = Number(t.p) || 0;
            jn.c.push({ t: t.t, g: null, cls: "k-" + tkState(v), pct: v, tail: v + "%", c: [] });
          });
          pn.c.push(jn);
        });
        root.c.push(pn);
      });
    } else {
      D.members.filter(function (m) { return mmFilter === "all" || m.id === mmFilter; }).forEach(function (m) {
        var ps = projectsOf(m.id);
        var mn = { t: m.name + " · " + m.role, g: m.focus, cls: "n-prog", pct: pctOfSet(ps), c: [] };
        var rs = D.routines[m.id] || [];
        if (rs.length) {
          var rn = { t: "루틴 업무", g: rs.filter(function (x) { return x.done; }).length + " / " + rs.length + " 완료", cls: "n-rt", c: [] };
          rs.forEach(function (x) { rn.c.push({ t: x.t, g: null, cls: x.done ? "k-done" : "k-todo", tail: x.cy, c: [] }); });
          mn.c.push(rn);
        }
        ps.forEach(function (p) {
          var g = program(p.prog);
          var jn = { t: p.name, g: g.id + " " + g.name, cls: "n-own", pct: pctOfProject(p), c: [] };
          (p.tasks || []).forEach(function (t) {
            var v = Number(t.p) || 0;
            jn.c.push({ t: t.t, g: null, cls: "k-" + tkState(v), pct: v, tail: v + "%", c: [] });
          });
          mn.c.push(jn);
        });
        root.c.push(mn);
      });
    }
    return root;
  }

  function renderTree(host, cols, opt) {
    opt = opt || {};
    var ROW = opt.row || 38, G1 = opt.g1 || 22, G2 = opt.g2 || 9, TOP = 24;
    var svg = host.querySelector("svg");
    host.innerHTML = "<svg></svg>"; svg = host.querySelector("svg");
    var root = opt.tree || buildTree();
    if (!root.c.length) { host.style.height = "70px"; return 0; }

    var cursor = TOP;
    (function lay(node, depth) {
      if (!node.c.length || depth >= cols.length - 1) { node.y = cursor; cursor += ROW; return; }
      node.c.forEach(function (ch, i) {
        if (i) cursor += (depth === 0 ? G1 : depth === 1 ? G2 : 0);
        lay(ch, depth + 1);
      });
      node.y = (node.c[0].y + node.c[node.c.length - 1].y) / 2;
    })(root, 0);

    var totalH = cursor + 18, W = cols[cols.length - 1].x + cols[cols.length - 1].w + 20;
    host.style.height = totalH + "px";
    host.style.minWidth = W + "px";
    svg.setAttribute("width", W); svg.setAttribute("height", totalH);

    (function draw(node, depth) {
      var c = cols[depth];
      var el = document.createElement("div");
      el.className = "n " + (node.cls || "");
      el.style.left = c.x + "px"; el.style.width = c.w + "px";
      el.style.minHeight = c.h + "px"; el.style.top = (node.y - c.h / 2) + "px";
      el.innerHTML = '<div class="t">' + esc(node.t) + (node.tail ? '<span class="tail">' + esc(node.tail) + "</span>" : "") + "</div>" +
        (node.g ? '<div class="g">' + esc(node.g) + "</div>" : "") +
        (node.pct != null ? '<div class="bar"><i style="width:' + (node.pct <= 0 ? 0 : Math.max(3, node.pct)) + '%"></i></div>' : "");
      host.appendChild(el);
      if (!node.c.length || depth >= cols.length - 1) return;
      var x1 = c.x + c.w, x2 = cols[depth + 1].x, mid = x1 + (x2 - x1) / 2;
      node.c.forEach(function (ch) {
        var pt = document.createElementNS("http://www.w3.org/2000/svg", "path");
        pt.setAttribute("d", "M " + x1 + " " + node.y + " H " + mid + " V " + ch.y + " H " + x2);
        pt.setAttribute("fill", "none"); pt.setAttribute("stroke", "var(--sub)"); pt.setAttribute("stroke-width", "1");
        svg.appendChild(pt);
        draw(ch, depth + 1);
      });
    })(root, 0);
    return totalH;
  }

          function () { toast("JSON 파일을 내려받았습니다"); },
          function (err) { toast(err && err.code === "declined" ? "저장을 취소했습니다" : "저장하지 못했습니다"); });
        return;
      }
      var blob = new Blob([json], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
      toast("JSON 파일을 내려받았습니다");
    };
    var e2 = $("#btnImp"); if (e2) e2.onclick = function () { $("#fileImp").click(); };
    var e3 = $("#fileImp"); if (e3) e3.onchange = function () {
      var f = e3.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        try {
          var o = JSON.parse(r.result);
          if (!o.meta || !o.members || !o.kpis) throw new Error("bad");
          if (!o.routines) o.routines = clone(SEED.routines);
          if (!o.workKpis) o.workKpis = clone(SEED.workKpis);
          if (!o.automations) o.automations = clone(SEED.automations);
          D = pfNormalize(pfKeep(o, D, false)); save(); repaint(false); toast("가져왔습니다");
        } catch (err) { toast("불러오지 못했습니다 — 이 트래커가 내보낸 JSON인지 확인해 주세요"); }
      };
      r.readAsText(f);
    };
    var su = $("#seedUnlock"), e4 = $("#btnSeed");
    if (su && e4) su.oninput = function () { e4.disabled = su.value.trim() !== SEED_LOCK; }; // 다시 그리면 다시 잠긴다
    if (e4) e4.onclick = function () {
      if (!su || su.value.trim() !== SEED_LOCK) return;
      if (!confirm("수정 내용을 버리고 기준선(" + SEED.meta.baseline + ") 상태로 되돌립니다. KPI·선행지표의 월별 실적과 이력은 그대로 둡니다. 계속할까요?")) return;
      D = pfNormalize(pfKeep(clone(SEED), D, true)); open = {}; jOpen = {}; auOpen = {}; pjEdit = null; save(); repaint(false); toast("기준선으로 되돌렸습니다");
    };
    var e5 = $("#btnWipe"); if (e5) e5.onclick = function () {
      if (!confirm("구조와 지표 정의는 남기고 진행률·측정값·루틴 체크만 비웁니다. KPI·선행지표의 월별 실적과 이력은 그대로 둡니다. 계속할까요?")) return;
      D.projects.forEach(function (p) { (p.tasks || []).forEach(function (t) { t.p = 0; }); });
      D.kpis.forEach(function (k) { k.cur = null; k.measured = false; });
      Object.keys(D.routines).forEach(function (id) { D.routines[id].forEach(function (r) { r.done = false; }); });
      Object.keys(D.personal).forEach(function (id) {
        D.personal[id].forEach(function (x) { if (!x.auto && !x.kpi) x.cur = null; });
      });
      save(); repaint(false); toast("업무·지표 값을 비웠습니다");
    };
  }

  /* ============================================================
     Firebase Realtime Database 공동 저장 (shared/b2bOpsTracker)
     - shared/taskTracker(다른 사이트)에는 절대 손대지 않는다. 경로가 다르다.
     - 전체를 통째로 덮어쓰지 않는다. 바뀐 최상위 키·항목 단위로만 update(PATCH)한다.
     - 이 PC의 localStorage 는 임시 캐시일 뿐, Firebase 가 공용 원본이다.
     ============================================================ */
  var FB_URL = "https://b2b-task-tracker-39144-default-rtdb.asia-southeast1.firebasedatabase.app";
  var FB_PATH = "shared/b2bOpsTracker";
  var FB_SDK_VER = "10.12.5";
  var FB_POLL_MS = 2000;
  var FB_SINGLE = ["meta", "bid", "perfConfig"];                                  // 통째로 비교·저장하는 단일 객체
  var FB_BY_ID = ["members", "programs", "projects", "workKpis", "kpis", "automations", "links", "mainKpis", "leadDefs", "lagDefs", "perfMonthly", "perfHistory"]; // id 있는 배열 → {id: item} 맵
  var FB_BY_MEMBER = ["routines", "personal"];                      // 이미 담당자 id로 묶인 맵
  var KEY_PENDING = "netform.b2b.tracker.pending.v1";

  var FB = {
    mode: null,          // 'sdk' | 'rest' | null
    state: "connecting", // connecting | synced | saving | error | offline
    sdk: null, db: null, root: null,
    synced: null,        // 마지막으로 원격과 같다고 확인된 Firebase 모양 스냅샷
    pending: null,       // 아직 못 올려서 쌓인 변경분 (Firebase 모양 조각)
    pushTimer: null, pollTimer: null, retryTimer: null,
    dirty: false,        // 아직 전송을 시작하지 않은 내 변경이 있음
    writing: 0, writeSeq: 0 // 전송 중인 요청 수 · 전송이 시작·끝날 때마다 올라가는 번호
  };

  function fbSetState(state) {
    FB.state = state;
    var el = $("#fbStatus"); if (!el) return;
    var label = { connecting: "연결 중…", synced: "동기화 완료", saving: "저장 중…",
      error: "연결 오류 · 재시도 중", offline: "오프라인 · 로컬 저장" }[state] || state;
    el.textContent = label;
    el.className = "fb-badge fb-" + state;
  }

  /* ---- 앱 데이터(D) ↔ Firebase 저장 모양 변환 ---- */
  function toRemoteShape(d) {
    var out = {};
    FB_SINGLE.forEach(function (k) { out[k] = d[k]; });
    FB_BY_ID.forEach(function (k) {
      var map = {};
      (d[k] || []).forEach(function (item) { if (item && item.id != null) map[item.id] = item; });
      out[k] = map;
    });
    FB_BY_MEMBER.forEach(function (k) { out[k] = d[k] || {}; });
    return out;
  }
  function fromRemoteShape(remote) {
    var d = clone(SEED); // 원격에 없는 최상위 키는 기본값으로 채워 화면이 깨지지 않게 한다
    if (!remote || typeof remote !== "object") return d;
    remote = clone(remote); // 화면 데이터가 FB.synced와 같은 객체를 쓰면 수정이 변경으로 잡히지 않는다
    FB_SINGLE.forEach(function (k) { if (remote[k] != null) d[k] = remote[k]; });
    FB_BY_ID.forEach(function (k) {
      if (!remote[k]) return;
      d[k] = Object.keys(remote[k]).sort().map(function (id) { return remote[k][id]; });
    });
    FB_BY_MEMBER.forEach(function (k) { if (remote[k]) d[k] = remote[k]; });
    return pfNormalize(d);
  }

  /* ---- 이전에 확인된 원격 모양과 비교해, 바뀐 항목의 경로만 뽑는다 ---- */
  function diffRemoteShape(oldShape, newShape) {
    var patch = {}, changed = false;
    oldShape = oldShape || {};
    FB_SINGLE.forEach(function (k) {
      if (JSON.stringify(oldShape[k]) !== JSON.stringify(newShape[k])) { patch[k] = newShape[k]; changed = true; }
    });
    FB_BY_ID.concat(FB_BY_MEMBER).forEach(function (k) {
      var om = oldShape[k] || {}, nm = newShape[k] || {};
      Object.keys(nm).forEach(function (id) {
        if (JSON.stringify(om[id]) !== JSON.stringify(nm[id])) { patch[k + "/" + id] = nm[id]; changed = true; }
      });
      Object.keys(om).forEach(function (id) {
        if (!(id in nm)) { patch[k + "/" + id] = null; changed = true; }
      });
    });
    return changed ? patch : null;
  }
  function mergePatch(target, patch) {
    target = target || {};
    Object.keys(patch).forEach(function (key) {
      var slash = key.indexOf("/");
      if (slash === -1) { target[key] = patch[key]; return; }
      var col = key.slice(0, slash), id = key.slice(slash + 1);
      if (!target[col]) target[col] = {};
      if (patch[key] === null) delete target[col][id]; else target[col][id] = patch[key];
    });
    return target;
  }

  /* ---- 보낼 변경은 항상 "컬렉션/항목" 경로로 둔다.
         { projects: { A: … } } 처럼 묶어 보내면 서버가 컬렉션 전체를 A 하나로 교체한다. ---- */
  function fbAddPending(pending, patch) {
    var out = {};
    Object.keys(pending || {}).forEach(function (k) { out[k] = pending[k]; });
    Object.keys(patch).forEach(function (k) { out[k] = patch[k]; });
    return out;
  }
  function fbFlatten(p) { // 이전 버전이 이 PC에 묶음 형태로 남겨 둔 변경을 경로 형태로 바꾼다
    if (!p) return p;
    var out = {}, cols = FB_BY_ID.concat(FB_BY_MEMBER);
    Object.keys(p).forEach(function (k) {
      if (cols.indexOf(k) >= 0 && p[k] && typeof p[k] === "object") {
        Object.keys(p[k]).forEach(function (id) { out[k + "/" + id] = p[k][id]; });
      } else out[k] = p[k];
    });
    return out;
  }

  /* ---- 오프라인 큐 (연결 끊긴 동안의 변경분을 이 PC에 잠시 보관) ---- */
  function loadPending() { try { return fbFlatten(JSON.parse(localStorage.getItem(KEY_PENDING) || "null")); } catch (e) { return null; } }
  function savePending(p) { try { if (p) localStorage.setItem(KEY_PENDING, JSON.stringify(p)); else localStorage.removeItem(KEY_PENDING); } catch (e) {} }

  /* ---- 전송 ---- */
  function fbWrite(patch) {
    if (FB.mode === "sdk" && FB.sdk && FB.root) return FB.sdk.update(FB.root, patch);
    return fetch(FB_URL + "/" + FB_PATH + ".json", {
      method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(patch)
    }).then(function (res) { if (!res.ok) throw new Error("HTTP " + res.status); });
  }
  function fbFullWrite(shape) {
    if (FB.mode === "sdk" && FB.sdk && FB.root) return FB.sdk.set(FB.root, shape);
    return fetch(FB_URL + "/" + FB_PATH + ".json", {
      method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(shape)
    }).then(function (res) { if (!res.ok) throw new Error("HTTP " + res.status); });
  }
  function fbRead() {
    if (FB.mode === "sdk" && FB.sdk && FB.root) return FB.sdk.get(FB.root).then(function (s) { return s.val(); });
    return fetch(FB_URL + "/" + FB_PATH + ".json", { cache: "no-store" }).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    });
  }

  function scheduleFbPush() {
    FB.dirty = true;
    clearTimeout(FB.pushTimer);
    FB.pushTimer = setTimeout(flushFbPatch, 400);
  }
  function flushFbPatch() {
    FB.dirty = false;
    var shape = clone(toRemoteShape(D));
    var patch = diffRemoteShape(FB.synced, shape);
    if (patch) FB.pending = fbAddPending(FB.pending, patch);
    if (!FB.pending) { fbSetState("synced"); return; }
    var sending = FB.pending;
    fbSetState("saving");
    FB.writing++; FB.writeSeq++;
    fbWrite(sending).then(function () {
      FB.writing--; FB.writeSeq++;
      FB.synced = mergePatch(FB.synced || {}, sending);
      if (FB.pending === sending) FB.pending = null;
      savePending(null);
      fbSetState("synced");
    }).catch(function () {
      FB.writing--; FB.writeSeq++;
      savePending(FB.pending);
      fbSetState("error");
      clearTimeout(FB.retryTimer);
      FB.retryTimer = setTimeout(flushFbPatch, 3000);
    });
  }

  /* ---- 서버는 키를 정렬하고 빈 값을 저장하지 않으므로, 같은 내용인지 그 기준으로 비교한다 ---- */
  function fbCanon(v) {
    function norm(x) {
      if (x === null || x === undefined) return undefined;
      if (Array.isArray(x)) { var a = x.map(norm).filter(function (y) { return y !== undefined; }); return a.length ? a : undefined; }
      if (typeof x === "object") {
        var o = {}, n = 0;
        Object.keys(x).sort().forEach(function (k) { var y = norm(x[k]); if (y !== undefined) { o[k] = y; n++; } });
        return n ? o : undefined;
      }
      return x;
    }
    return JSON.stringify(norm(v));
  }

  /* ---- 다른 컴퓨터의 변경을 화면에 반영 ---- */
  function onRemoteShape(shape) {
    if (!shape) return;
    if (FB.synced && fbCanon(shape) === fbCanon(FB.synced)) return; // 내가 방금 올린 것의 메아리
    var mine = FB.dirty ? diffRemoteShape(FB.synced, toRemoteShape(D)) : null; // 아직 안 보낸 내 변경은 잃지 않는다
    FB.synced = shape;
    D = fromRemoteShape(mine ? mergePatch(clone(shape), mine) : shape);
    try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) {}
    if (mine) { clearTimeout(FB.pushTimer); flushFbPatch(); }
    repaint(true);
  }

  /* ---- SDK 를 못 쓸 때: 2초 주기 REST 폴링 ---- */
  function fbPollTick() {
    if (FB.writing) return;
    var seq = FB.writeSeq;
    fbRead().then(function (raw) {
      if (FB.state === "error" || FB.state === "offline") fbSetState(FB.pending ? "saving" : "synced");
      if (FB.pending || FB.dirty || FB.writing || seq !== FB.writeSeq) return; // 저장 전에 읽은 옛 값으로 내 변경을 덮어쓰지 않는다
      onRemoteShape(raw);
    }).catch(function () {
      fbSetState(FB.pending ? "error" : "offline");
    });
  }
  function fbStartRest() {
    FB.mode = "rest";
    clearInterval(FB.pollTimer);
    FB.pollTimer = setInterval(fbPollTick, FB_POLL_MS);
  }

  /* ---- 최초 원격 데이터 반영 ---- */
  function applyInitialRemote(raw) {
    var pending = loadPending();
    if (raw && Object.keys(raw).length) {
      FB.synced = raw;
      D = fromRemoteShape(pending ? mergePatch(clone(raw), pending) : raw);
      if (pending) FB.pending = pending;
    } else {
      // Firebase 가 완전히 비어 있을 때만 이 HTML 의 기본 데이터를 최초 1회 등록한다
      D = clone(SEED);
      FB.synced = clone(toRemoteShape(D));
      fbFullWrite(FB.synced).catch(function () {});
    }
    try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) {}
    if (FB.pending) { fbSetState("saving"); flushFbPatch(); } else fbSetState("synced");
  }

  /* ---- 부팅: Firebase 를 먼저 읽은 뒤에만 화면을 그린다 (localStorage 캐시와 자동 병합하지 않는다) ---- */
  function fbBoot() {
    fbSetState("connecting");
    var sdkPromise = Promise.race([
      Promise.all([
        import(FB_URL_APP_MOD()),
        import(FB_URL_DB_MOD())
      ]).then(function (mods) {
        var appMod = mods[0], dbMod = mods[1];
        var app = appMod.initializeApp({ databaseURL: FB_URL });
        FB.db = dbMod.getDatabase(app);
        FB.sdk = dbMod;
        FB.root = dbMod.ref(FB.db, FB_PATH);
        FB.mode = "sdk";
        return new Promise(function (resolve, reject) {
          var first = true;
          dbMod.onValue(FB.root, function (snap) {
            if (first) { first = false; resolve(snap.val()); } else onRemoteShape(snap.val());
          }, function (err) { reject(err); });
        });
      }),
      new Promise(function (_, rej) { setTimeout(function () { rej(new Error("sdk timeout")); }, 6000); })
    ]);
    return sdkPromise.catch(function () {
      fbStartRest();
      return fbRead();
    }).then(function (raw) {
      applyInitialRemote(raw);
    }).catch(function () {
      // Firebase 에 아예 닿지 못함 — 이 PC에 남아 있던 캐시(또는 기본값)로 우선 시작하고 계속 재접속을 시도한다
      var pending = loadPending();
      D = load();
      if (pending) FB.pending = pending;
      fbSetState("offline");
      if (!FB.pollTimer) { FB.mode = FB.mode || "rest"; fbStartRest(); }
    });
  }
  function FB_URL_APP_MOD() { return "https://www.gstatic.com/firebasejs/" + FB_SDK_VER + "/firebase-app.js"; }
  function FB_URL_DB_MOD() { return "https://www.gstatic.com/firebasejs/" + FB_SDK_VER + "/firebase-database.js"; }

  /* ---------- 시작 ---------- */
  function boot() {
    var h = (location.hash || "").replace("#", "");
    if (PAGES.some(function (p) { return p.id === h; })) cur = h;
    fbBoot().then(function () {
      $("#today").textContent = D.meta.baseDate;
      render();
      window.addEventListener("resize", function () { if (cur === "map") drawMap(); });
    });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

</body>
